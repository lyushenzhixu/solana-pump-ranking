<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap');

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

/* Design tokens (OKLCH, tinted neutrals, no pure black — Impeccable-aligned) */
:root {
  --surface-0: oklch(10% 0.02 270);
  --surface-1: oklch(14% 0.02 270);
  --surface-2: oklch(18% 0.02 270);
  --surface-3: oklch(22% 0.02 270);
  --text-primary: oklch(92% 0.01 270);
  --text-secondary: oklch(72% 0.02 270);
  --text-muted: oklch(55% 0.02 270);
  --accent: oklch(62% 0.2 290);
  --accent-dim: oklch(50% 0.12 290);
  --positive: oklch(72% 0.18 155);
  --negative: oklch(58% 0.22 25);
  --ease-out: cubic-bezier(0.33, 1, 0.68, 1);
  --space-xs: 0.25rem;
  --space-sm: 0.5rem;
  --space-md: 1rem;
  --space-lg: 1.5rem;
  --space-xl: 2.5rem;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-full: 9999px;
  /* Legacy hex for SVG/logo compatibility */
  --sol-purple: #9945FF;
  --sol-green: #14F195;
  --sol-blue: #00D1FF;
  --phantom-pink: #AB47FF;
  --warp-magenta: #B84DE0;
  --bn-yellow: #F0B90B;
}

@media (prefers-reduced-motion: reduce) {
  :root { --motion-duration: 0.01ms; }
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

html, body {
  width: 100%;
  min-height: 100%;
  background: var(--surface-0);
  font-family: 'Orbitron', sans-serif;
}

/* 顶部导航:浮在 hero 视觉之上,可点击 */
.zl-nav {
  position: relative;
  z-index: 60;
  background: oklch(10% 0.02 270 / 0.4);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid oklch(55% 0.15 290 / 0.12);
}

.universe {
  position: relative;
  min-height: calc(100vh - 56px);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(ellipse at 50% 50%, var(--surface-1) 0%, var(--surface-0) 50%, var(--surface-0) 100%);
}

/* hero 内的全屏背景装饰层钉在 hero 内部,不随页面滚动溢出 */
.universe .stars,
.universe .nebula,
.universe .warp-grid,
.universe .shadow-entity,
.universe .distortion-orb,
.universe .light-streak,
.universe .light-streak-2,
.universe .brand-logos,
.universe .glyphs,
.universe .vignette,
.universe .scanlines,
.universe .noise {
  position: absolute;
}

/* === STARS === */
.stars {
  position: absolute; inset: 0;
  background-image:
    radial-gradient(1px 1px at 10% 20%, oklch(70% 0.15 290 / 0.35), transparent),
    radial-gradient(1px 1px at 30% 70%, oklch(70% 0.12 155 / 0.25), transparent),
    radial-gradient(1.5px 1.5px at 50% 10%, oklch(75% 0.1 230 / 0.3), transparent),
    radial-gradient(1px 1px at 70% 40%, oklch(90% 0.01 270 / 0.2), transparent),
    radial-gradient(1px 1px at 90% 80%, oklch(65% 0.12 300 / 0.25), transparent),
    radial-gradient(1px 1px at 15% 90%, oklch(60% 0.1 330 / 0.2), transparent),
    radial-gradient(1.5px 1.5px at 80% 15%, oklch(68% 0.1 155 / 0.2), transparent),
    radial-gradient(1px 1px at 45% 55%, oklch(65% 0.15 290 / 0.3), transparent),
    radial-gradient(1px 1px at 65% 85%, oklch(70% 0.08 230 / 0.2), transparent),
    radial-gradient(1px 1px at 25% 35%, oklch(88% 0.01 270 / 0.15), transparent);
  background-size: 300px 300px;
  animation: starDrift 80s linear infinite;
}

@keyframes starDrift {
  to { background-position: 300px 300px; }
}

/* === NEBULA LAYERS === */
.nebula {
  position: absolute; inset: -50%;
  width: 200%; height: 200%;
}

.nebula-layer {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.4;
  mix-blend-mode: screen;
}

.nebula-1 {
  background: radial-gradient(ellipse at 30% 40%, var(--accent), transparent 60%);
  animation: nebulaFloat1 12s ease-in-out infinite alternate;
  opacity: 0.2;
}
.nebula-2 {
  background: radial-gradient(ellipse at 70% 60%, var(--positive), transparent 55%);
  animation: nebulaFloat2 15s ease-in-out infinite alternate;
  opacity: 0.12;
}
.nebula-3 {
  background: radial-gradient(ellipse at 50% 30%, oklch(65% 0.12 230), transparent 50%);
  animation: nebulaFloat3 18s ease-in-out infinite alternate;
  opacity: 0.1;
}
.nebula-4 {
  background: radial-gradient(ellipse at 40% 70%, var(--accent-dim), transparent 50%);
  animation: nebulaFloat4 20s ease-in-out infinite alternate;
  opacity: 0.08;
  mix-blend-mode: color-dodge;
}

@keyframes nebulaFloat1 {
  0% { transform: translate(-10%, -5%) scale(1) rotate(0deg); }
  100% { transform: translate(10%, 5%) scale(1.2) rotate(15deg); }
}
@keyframes nebulaFloat2 {
  0% { transform: translate(5%, -10%) scale(1.1) rotate(0deg); }
  100% { transform: translate(-8%, 8%) scale(0.9) rotate(-20deg); }
}
@keyframes nebulaFloat3 {
  0% { transform: translate(0%, 10%) scale(0.8) rotate(10deg); }
  100% { transform: translate(5%, -10%) scale(1.3) rotate(-10deg); }
}
@keyframes nebulaFloat4 {
  0% { transform: translate(-5%, 5%) scale(1) rotate(-5deg); }
  100% { transform: translate(8%, -8%) scale(1.15) rotate(12deg); }
}

/* === WARP GRID === */
.warp-grid {
  position: absolute;
  inset: 0;
  background:
    linear-gradient(oklch(50% 0.05 290 / 0.06) 1px, transparent 1px),
    linear-gradient(90deg, oklch(50% 0.05 290 / 0.06) 1px, transparent 1px);
  background-size: 60px 60px;
  transform: perspective(500px) rotateX(60deg) translateY(20%);
  transform-origin: center bottom;
  animation: gridPulse 4s ease-in-out infinite;
  mask-image: linear-gradient(to top, oklch(0% 0 0 / 0.4) 0%, transparent 70%);
  -webkit-mask-image: linear-gradient(to top, oklch(0% 0 0 / 0.4) 0%, transparent 70%);
}

@keyframes gridPulse {
  0%, 100% { opacity: 0.3; background-size: 60px 60px; }
  50% { opacity: 0.6; background-size: 62px 62px; }
}

/* === DISTORTION ORB === */
.distortion-orb {
  position: absolute;
  width: 600px; height: 600px;
  border-radius: 50%;
  background: conic-gradient(
    from 0deg,
    transparent, var(--accent), transparent, var(--positive),
    transparent, oklch(65% 0.12 230), transparent, var(--accent-dim), transparent
  );
  filter: blur(60px);
  opacity: 0.08;
  mix-blend-mode: screen;
  animation: orbSpin 25s linear infinite, orbPulse 8s ease-in-out infinite;
}

@keyframes orbSpin {
  to { transform: rotate(360deg); }
}
@keyframes orbPulse {
  0%, 100% { opacity: 0.1; transform: scale(1) rotate(0deg); }
  50% { opacity: 0.25; transform: scale(1.15) rotate(180deg); }
}

/* ========================================
   FLOATING BRAND LOGOS - SOLANA / POLYMARKET / BINANCE
   ======================================== */
.brand-logos {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 3;
}

.brand-logo-defs {
  position: absolute;
  width: 0;
  height: 0;
  overflow: hidden;
}

.brand-logo {
  position: absolute;
  display: block;
  opacity: 1;
  mix-blend-mode: screen;
  will-change: transform;
  transform: translate3d(var(--px, 0px), var(--py, 0px), 0);
}

.brand-logo .logo-layer {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.brand-logo .core {
  opacity: 0.14;
  filter: blur(0.4px);
}

.brand-logo .phantom {
  opacity: 0;
  filter: blur(2.2px);
}

.brand-logo .phantom-1 { animation: phantomFloat1 var(--pf1-dur, 14s) ease-in-out infinite var(--pf1-delay, 0s); }
.brand-logo .phantom-2 { animation: phantomFloat2 var(--pf2-dur, 18s) ease-in-out infinite var(--pf2-delay, 0s); }
.brand-logo .phantom-3 { animation: phantomFloat3 var(--pf3-dur, 16s) ease-in-out infinite var(--pf3-delay, 0s); }

.brand-logo svg {
  width: 100%;
  height: 100%;
}

/* --- Solana (紫绿渐变, 左上/右下/中上) --- */
.logo-sol-1 {
  width: 90px; height: 90px;
  left: 8%; top: 18%;
  --pf1-dur: 14s; --pf2-dur: 18s; --pf3-dur: 16s;
  --pf1-delay: 0s; --pf2-delay: 1.6s; --pf3-delay: 3.8s;
  animation: phantomSpin1 33s linear infinite;
}
.logo-sol-2 {
  width: 55px; height: 55px;
  right: 12%; bottom: 22%;
  --pf1-dur: 15s; --pf2-dur: 18s; --pf3-dur: 20s;
  --pf1-delay: 2.2s; --pf2-delay: 0.8s; --pf3-delay: 4.6s;
  animation: phantomSpinReverse 41s linear infinite;
}
.logo-sol-3 {
  width: 40px; height: 40px;
  left: 55%; top: 8%;
  --pf1-dur: 19s; --pf2-dur: 16s; --pf3-dur: 14s;
  --pf1-delay: 4.8s; --pf2-delay: 1.2s; --pf3-delay: 0s;
  animation: phantomSpin1 37s linear infinite;
}

/* --- Polymarket (冰蓝 P+圆环+虚线轨道) --- */
.logo-poly-1 {
  width: 80px; height: 80px;
  right: 8%; top: 15%;
  --pf1-dur: 17s; --pf2-dur: 16s; --pf3-dur: 21s;
  --pf1-delay: 2.5s; --pf2-delay: 1s; --pf3-delay: 5.5s;
  animation: phantomSpinReverse 29s linear infinite;
}
.logo-poly-2 {
  width: 50px; height: 50px;
  left: 15%; bottom: 18%;
  --pf1-dur: 18s; --pf2-dur: 22s; --pf3-dur: 15s;
  --pf1-delay: 0.6s; --pf2-delay: 4.2s; --pf3-delay: 5s;
  animation: phantomSpin1 39s linear infinite;
}
.logo-poly-3 {
  width: 35px; height: 35px;
  right: 40%; bottom: 8%;
  --pf1-dur: 20s; --pf2-dur: 16s; --pf3-dur: 19s;
  --pf1-delay: 9s; --pf2-delay: 1.8s; --pf3-delay: 6.4s;
  animation: phantomSpinReverse 45s linear infinite;
}

/* --- Binance (金黄菱形五钻) --- */
.logo-bn-1 {
  width: 75px; height: 75px;
  left: 5%; top: 55%;
  --pf1-dur: 15s; --pf2-dur: 21s; --pf3-dur: 17s;
  --pf1-delay: 4.2s; --pf2-delay: 1.4s; --pf3-delay: 2s;
  animation: phantomSpin1 32s linear infinite;
}
.logo-bn-2 {
  width: 60px; height: 60px;
  right: 6%; top: 50%;
  --pf1-dur: 13s; --pf2-dur: 19s; --pf3-dur: 16s;
  --pf1-delay: 4s; --pf2-delay: 1.8s; --pf3-delay: 6.2s;
  animation: phantomSpinReverse 36s linear infinite;
}
.logo-bn-3 {
  width: 42px; height: 42px;
  left: 35%; top: 5%;
  --pf1-dur: 17s; --pf2-dur: 19s; --pf3-dur: 15s;
  --pf1-delay: 1.2s; --pf2-delay: 8s; --pf3-delay: 4.8s;
  animation: phantomSpin1 42s linear infinite;
}

@keyframes phantomFloat1 {
  0%, 100% { opacity: 0; transform: translate(0, 0) scale(0.6); filter: blur(4px); }
  15% { opacity: 0.12; filter: blur(2px); }
  30% { opacity: 0.06; transform: translate(25px, -35px) scale(0.9); filter: blur(1px); }
  50% { opacity: 0.18; transform: translate(-15px, -50px) scale(1.1); filter: blur(0.5px); }
  70% { opacity: 0.08; transform: translate(20px, -30px) scale(0.85); filter: blur(2px); }
  85% { opacity: 0.14; filter: blur(1.5px); }
}
@keyframes phantomFloat2 {
  0%, 100% { opacity: 0; transform: translate(0, 0) scale(0.7); filter: blur(3px); }
  10% { opacity: 0.05; }
  25% { opacity: 0.15; transform: translate(-30px, 20px) scale(1.05); filter: blur(0.5px); }
  45% { opacity: 0.04; transform: translate(-40px, 40px) scale(0.75); filter: blur(3px); }
  65% { opacity: 0.2; transform: translate(-10px, 25px) scale(1.15); filter: blur(0px); }
  80% { opacity: 0.07; filter: blur(2px); }
}
@keyframes phantomFloat3 {
  0%, 100% { opacity: 0; transform: translate(0, 0) scale(0.5); filter: blur(5px); }
  20% { opacity: 0.1; transform: translate(15px, 30px) scale(0.95); filter: blur(1px); }
  35% { opacity: 0.22; transform: translate(30px, 15px) scale(1.2); filter: blur(0px); }
  55% { opacity: 0.03; transform: translate(40px, 45px) scale(0.7); filter: blur(4px); }
  75% { opacity: 0.16; transform: translate(20px, 35px) scale(1); filter: blur(1px); }
  90% { opacity: 0.05; filter: blur(3px); }
}
@keyframes phantomSpin1 {
  from { rotate: 0deg; }
  to { rotate: 360deg; }
}
@keyframes phantomSpinReverse {
  from { rotate: 0deg; }
  to { rotate: -360deg; }
}

.brand-logo::before {
  content: '';
  position: absolute;
  inset: -30%;
  border-radius: 50%;
  background: radial-gradient(circle, currentColor, transparent 70%);
  opacity: 0.15;
  filter: blur(15px);
  animation: logoGlowPulse 5s ease-in-out infinite;
}
.logo-sol-1, .logo-sol-2, .logo-sol-3 { color: var(--sol-purple); }
.logo-sol-2::before { animation-delay: 1.5s; }
.logo-poly-1, .logo-poly-2, .logo-poly-3 { color: var(--sol-blue); }
.logo-poly-1::before { animation-delay: 0.8s; }
.logo-bn-1, .logo-bn-2, .logo-bn-3 { color: var(--bn-yellow); }
.logo-bn-1::before { animation-delay: 2s; }
@keyframes logoGlowPulse {
  0%, 100% { opacity: 0.08; transform: scale(1); }
  50% { opacity: 0.25; transform: scale(1.3); }
}

/* === PHANTOM RING === */
.phantom-rings {
  position: absolute;
  width: 500px; height: 500px;
}

.phantom-ring {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 1px solid transparent;
}

.phantom-ring:nth-child(1) {
  border-color: oklch(60% 0.15 290 / 0.2);
  animation: ringExpand 6s ease-in-out infinite;
}
.phantom-ring:nth-child(2) {
  border-color: oklch(70% 0.12 155 / 0.12);
  animation: ringExpand 6s ease-in-out infinite 1s;
  inset: 20px;
}
.phantom-ring:nth-child(3) {
  border-color: oklch(65% 0.1 230 / 0.1);
  animation: ringExpand 6s ease-in-out infinite 2s;
  inset: 40px;
}
.phantom-ring:nth-child(4) {
  border-color: oklch(55% 0.12 290 / 0.08);
  animation: ringExpand 6s ease-in-out infinite 3s;
  inset: 60px;
}
.phantom-ring:nth-child(5) {
  border-color: oklch(50% 0.1 290 / 0.05);
  animation: ringExpand 6s ease-in-out infinite 4s;
  inset: 80px;
}

@keyframes ringExpand {
  0%, 100% { transform: scale(1) rotate(0deg); opacity: 0; }
  20% { opacity: 1; }
  80% { opacity: 1; }
  50% { transform: scale(1.5) rotate(90deg); }
  100% { transform: scale(2) rotate(180deg); opacity: 0; }
}

/* === FLOATING GLYPHS === */
.glyphs {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.glyph {
  position: absolute;
  font-size: 24px;
  opacity: 0;
  animation: glyphFloat 10s ease-in-out infinite;
  filter: blur(1px);
}

.glyph:nth-child(1) { left: 10%; top: 20%; animation-delay: 0s; color: var(--sol-purple); }
.glyph:nth-child(2) { left: 80%; top: 15%; animation-delay: 2s; color: var(--sol-green); }
.glyph:nth-child(3) { left: 20%; top: 75%; animation-delay: 4s; color: var(--sol-blue); }
.glyph:nth-child(4) { left: 85%; top: 70%; animation-delay: 1s; color: var(--phantom-pink); }
.glyph:nth-child(5) { left: 50%; top: 10%; animation-delay: 3s; color: var(--warp-magenta); }
.glyph:nth-child(6) { left: 5%; top: 50%; animation-delay: 5s; color: var(--sol-green); }
.glyph:nth-child(7) { left: 90%; top: 45%; animation-delay: 7s; color: var(--sol-purple); }
.glyph:nth-child(8) { left: 40%; top: 85%; animation-delay: 6s; color: var(--sol-blue); }

@keyframes glyphFloat {
  0% { opacity: 0; transform: translateY(20px) scale(0.5) rotate(0deg); filter: blur(3px); }
  20% { opacity: 0.4; filter: blur(1px); }
  50% { opacity: 0.15; transform: translateY(-30px) scale(1.2) rotate(180deg); filter: blur(0px); }
  80% { opacity: 0.3; filter: blur(1px); }
  100% { opacity: 0; transform: translateY(20px) scale(0.5) rotate(360deg); filter: blur(3px); }
}

/* === CENTER CONTENT === */
.center-content {
  position: relative;
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: clamp(2rem, 5vw, 3.5rem);
  max-width: 56rem;
  margin: 0 auto;
  padding: 0 var(--space-lg);
  text-align: center;
}

/* === TITLE === */
.title-wrapper {
  text-align: center;
  animation: titleReveal 2s ease-out forwards;
  opacity: 0;
}

@keyframes titleReveal {
  0% { opacity: 0; transform: translateY(-30px); filter: blur(20px); }
  100% { opacity: 1; transform: translateY(0); filter: blur(0); }
}

.pre-title {
  font-family: var(--font-ui);
  font-size: 14px;
  letter-spacing: 8px;
  text-transform: uppercase;
  color: var(--text-secondary);
  margin-bottom: 16px;
  animation: preFlicker 3s ease-in-out infinite;
}

@keyframes preFlicker {
  0%, 100% { opacity: 0.4; }
  50% { opacity: 0.9; letter-spacing: 10px; }
}

.main-title {
  font-size: clamp(32px, 6vw, 72px);
  font-weight: 900;
  line-height: 1.1;
  color: var(--text-primary);
  position: relative;
}

.sub-title {
  font-family: var(--font-ui);
  font-size: clamp(12px, 2vw, 16px);
  font-weight: 300;
  color: var(--text-muted);
  margin-top: 16px;
  letter-spacing: 4px;
  animation: subBreath 4s ease-in-out infinite;
}

@keyframes subBreath {
  0%, 100% { opacity: 0.25; }
  50% { opacity: 0.5; }
}

/* === EXPLORE BUTTON === */
.btn-container {
  position: relative;
  animation: btnReveal 2s ease-out 0.5s forwards;
  opacity: 0;
}

@keyframes btnReveal {
  0% { opacity: 0; transform: translateY(30px) scale(0.8); filter: blur(10px); }
  100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
}

.explore-btn {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 20px 60px;
  font-family: 'Orbitron', sans-serif;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 6px;
  text-transform: uppercase;
  color: var(--text-primary);
  text-decoration: none;
  background: transparent;
  border: none;
  cursor: pointer;
  overflow: visible;
  transition: transform 0.25s var(--ease-out), color 0.2s var(--ease-out), box-shadow 0.2s var(--ease-out);
  z-index: 1;
}
.explore-btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 4px;
}

/* Outer ring */
.explore-btn::before {
  content: '';
  position: absolute;
  inset: -3px;
  border-radius: var(--radius-full);
  padding: 2px;
  background: linear-gradient(135deg, var(--accent), var(--accent-dim));
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
}

/* Inner background */
.explore-btn::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: calc(var(--radius-full) - 2px);
  background: oklch(20% 0.02 270 / 0.6);
  backdrop-filter: blur(10px);
  z-index: -1;
  transition: background 0.2s var(--ease-out);
}

@keyframes borderRotate {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* Hover shadow pulses */
.btn-shadow {
  position: absolute;
  inset: -20px;
  border-radius: 80px;
  background: radial-gradient(ellipse, oklch(55% 0.15 290 / 0.15), transparent 70%);
  filter: blur(20px);
  animation: shadowPulse 3s ease-in-out infinite;
  pointer-events: none;
}

@keyframes shadowPulse {
  0%, 100% { transform: scale(1); opacity: 0.5; }
  50% { transform: scale(1.2); opacity: 0.8; }
}

.explore-btn:hover {
  transform: scale(1.05);
  letter-spacing: 8px;
  color: var(--text-primary);
  box-shadow: 0 0 24px oklch(55% 0.2 290 / 0.25);
}

.explore-btn:hover::after {
  background: oklch(24% 0.03 270 / 0.75);
}

.explore-btn:hover ~ .btn-shadow {
  animation: shadowExplode 0.6s ease-out forwards;
}

@keyframes shadowExplode {
  0% { transform: scale(1); opacity: 0.8; }
  100% { transform: scale(2); opacity: 0; }
}

.explore-btn:active {
  transform: scale(0.95);
}

/* Scanning line on button */
.btn-scanline {
  position: absolute;
  top: 0; left: -100%;
  width: 60%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
  animation: scanBtn 4s ease-in-out infinite;
  pointer-events: none;
  border-radius: 60px;
}

@keyframes scanBtn {
  0% { left: -60%; }
  50% { left: 100%; }
  100% { left: 100%; }
}

/* Orbiting particles around button */
.orbit-particle {
  position: absolute;
  width: 4px; height: 4px;
  border-radius: 50%;
  pointer-events: none;
}

.orbit-particle:nth-child(1) {
  background: var(--sol-purple);
  box-shadow: 0 0 10px var(--sol-purple);
  animation: orbit1 5s linear infinite;
}
.orbit-particle:nth-child(2) {
  background: var(--sol-green);
  box-shadow: 0 0 10px var(--sol-green);
  animation: orbit2 7s linear infinite;
}
.orbit-particle:nth-child(3) {
  background: var(--sol-blue);
  box-shadow: 0 0 8px var(--sol-blue);
  animation: orbit3 6s linear infinite reverse;
}

@keyframes orbit1 {
  0% { transform: rotate(0deg) translateX(140px) rotate(0deg); opacity: 0.8; }
  50% { opacity: 0.2; }
  100% { transform: rotate(360deg) translateX(140px) rotate(-360deg); opacity: 0.8; }
}
@keyframes orbit2 {
  0% { transform: rotate(120deg) translateX(160px) rotate(-120deg); opacity: 0.6; }
  50% { opacity: 0.15; }
  100% { transform: rotate(480deg) translateX(160px) rotate(-480deg); opacity: 0.6; }
}
@keyframes orbit3 {
  0% { transform: rotate(240deg) translateX(130px) rotate(-240deg); opacity: 0.7; }
  50% { opacity: 0.1; }
  100% { transform: rotate(600deg) translateX(130px) rotate(-600deg); opacity: 0.7; }
}

/* === SCANLINE OVERLAY === */
.scanlines {
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,0,0,0.03) 2px,
    rgba(0,0,0,0.03) 4px
  );
  pointer-events: none;
  z-index: 100;
  animation: scanShift 0.1s steps(2) infinite;
}

@keyframes scanShift {
  to { background-position: 0 4px; }
}

/* === CHROMATIC NOISE === */
.noise {
  position: absolute;
  inset: 0;
  opacity: 0.03;
  pointer-events: none;
  z-index: 99;
  mix-blend-mode: overlay;
  animation: noiseAnim 0.5s steps(4) infinite;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

@keyframes noiseAnim {
  0% { transform: translate(0,0); }
  25% { transform: translate(-2px, 2px); }
  50% { transform: translate(2px, -1px); }
  75% { transform: translate(-1px, -2px); }
  100% { transform: translate(0,0); }
}

/* === VIGNETTE === */
.vignette {
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at center, transparent 40%, oklch(8% 0.02 270 / 0.7) 100%);
  pointer-events: none;
  z-index: 50;
}

/* === FLOATING MEME SHADOWS === */
.shadow-entity {
  position: absolute;
  border-radius: 50%;
  filter: blur(40px);
  mix-blend-mode: color-dodge;
  opacity: 0;
  pointer-events: none;
}

.shadow-entity:nth-child(1) {
  width: 200px; height: 200px;
  background: var(--sol-purple);
  left: 10%; top: 30%;
  animation: entityDrift 12s ease-in-out infinite;
}
.shadow-entity:nth-child(2) {
  width: 150px; height: 150px;
  background: var(--sol-green);
  right: 15%; top: 20%;
  animation: entityDrift 15s ease-in-out infinite 3s;
}
.shadow-entity:nth-child(3) {
  width: 180px; height: 180px;
  background: var(--warp-magenta);
  left: 30%; bottom: 15%;
  animation: entityDrift 10s ease-in-out infinite 6s;
}
.shadow-entity:nth-child(4) {
  width: 120px; height: 120px;
  background: var(--sol-blue);
  right: 25%; bottom: 25%;
  animation: entityDrift 18s ease-in-out infinite 2s;
}

@keyframes entityDrift {
  0%, 100% { opacity: 0; transform: translate(0, 0) scale(0.5); }
  25% { opacity: 0.15; transform: translate(30px, -20px) scale(1); }
  50% { opacity: 0.08; transform: translate(-20px, 30px) scale(1.3); }
  75% { opacity: 0.12; transform: translate(10px, 10px) scale(0.8); }
}

/* === BOTTOM HINT === */
.bottom-hint {
  position: absolute;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  font-family: var(--font-ui);
  font-size: 11px;
  letter-spacing: 3px;
  color: var(--text-muted);
  z-index: 10;
  animation: hintPulse 3s ease-in-out infinite;
}

@keyframes hintPulse {
  0%, 100% { opacity: 0.15; transform: translateX(-50%) translateY(0); }
  50% { opacity: 0.4; transform: translateX(-50%) translateY(-5px); }
}

.bottom-hint .arrow {
  display: block;
  text-align: center;
  margin-bottom: 8px;
  font-size: 16px;
  animation: arrowBounce 2s ease-in-out infinite;
}

@keyframes arrowBounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(5px); }
}

/* === GLITCH on hover === */
.explore-btn:hover .btn-text {
  animation: textGlitch 0.3s ease-in-out;
}

@keyframes textGlitch {
  0% { transform: translate(0); }
  20% { transform: translate(-2px, 2px); text-shadow: 2px 0 var(--sol-green), -2px 0 var(--warp-magenta); }
  40% { transform: translate(2px, -1px); text-shadow: -2px 0 var(--sol-blue), 2px 0 var(--sol-purple); }
  60% { transform: translate(-1px, -2px); }
  80% { transform: translate(1px, 1px); text-shadow: 1px 0 var(--sol-green); }
  100% { transform: translate(0); text-shadow: none; }
}

.btn-text {
  position: relative;
  z-index: 2;
  display: inline-block;
}

/* ripple on click */
.ripple-ring {
  position: absolute;
  border-radius: 50%;
  border: 2px solid var(--sol-purple);
  width: 10px; height: 10px;
  pointer-events: none;
  opacity: 0;
  z-index: 200;
}

.ripple-ring.active {
  animation: rippleOut 1s ease-out forwards;
}

@keyframes rippleOut {
  0% { transform: translate(-50%, -50%) scale(0); opacity: 0.8; }
  100% { transform: translate(-50%, -50%) scale(40); opacity: 0; }
}

/* Portal effect behind button */
.portal {
  position: absolute;
  width: 300px; height: 300px;
  border-radius: 50%;
  background: conic-gradient(
    from 0deg,
    transparent,
    rgba(153,69,255,0.05),
    transparent,
    rgba(20,241,149,0.03),
    transparent,
    rgba(0,209,255,0.05),
    transparent
  );
  animation: portalSpin 10s linear infinite;
  filter: blur(2px);
  pointer-events: none;
}

@keyframes portalSpin {
  to { transform: rotate(360deg); }
}

/* Horizontal light streak */
.light-streak {
  position: absolute;
  width: 100vw;
  height: 1px;
  top: 50%;
  left: 0;
  background: linear-gradient(90deg, transparent, oklch(55% 0.15 290 / 0.12), oklch(70% 0.12 155 / 0.1), oklch(65% 0.1 230 / 0.08), transparent);
  z-index: 5;
  animation: streakGlow 4s ease-in-out infinite;
}

@keyframes streakGlow {
  0%, 100% { opacity: 0.3; height: 1px; }
  50% { opacity: 0.7; height: 2px; }
}

/* Second streak */
.light-streak-2 {
  position: absolute;
  width: 1px;
  height: 100vh;
  top: 0;
  left: 50%;
  background: linear-gradient(180deg, transparent, oklch(55% 0.12 290 / 0.06), oklch(58% 0.1 300 / 0.08), oklch(55% 0.12 290 / 0.06), transparent);
  z-index: 5;
  animation: streakGlow2 5s ease-in-out infinite 1s;
}

@keyframes streakGlow2 {
  0%, 100% { opacity: 0.2; width: 1px; }
  50% { opacity: 0.5; width: 2px; }
}

/* === VALUE PROP === */
.value-prop {
  font-family: var(--font-ui);
  font-size: 18px;
  line-height: 1.6;
  color: var(--text-secondary);
  margin-top: 20px;
  max-width: 40rem;
  margin-left: auto;
  margin-right: auto;
}
@media (max-width: 560px) {
  .value-prop { font-size: 15px; }
}

/* === LIVE TOP-3 HUD === */
#zl-hud { font-family: var(--font-ui); }
.hud-row {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 11px 20px;
  font-size: 14px;
  color: var(--text-primary);
}
.hud-row + .hud-row { border-top: 1px solid oklch(55% 0.04 290 / 0.12); }
.hud-row .hud-rank { color: var(--text-muted); width: 30px; flex: 0 0 auto; }
.hud-row .hud-name { flex: 1 1 auto; text-align: left; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hud-row .hud-name .hud-sym { color: var(--text-muted); font-size: 12px; margin-left: 6px; }
.hud-row .hud-vol { flex: 0 0 auto; width: 88px; text-align: right; color: var(--text-secondary); }
.hud-row .hud-chg { flex: 0 0 auto; width: 64px; text-align: right; }
.hud-row .hud-sig { flex: 0 0 auto; width: 64px; text-align: right; color: var(--text-muted); font-size: 12px; }
.hud-fallback {
  padding: 18px 22px;
  text-align: center;
  font-family: var(--font-ui);
  color: var(--text-secondary);
  font-size: 14px;
}
.hud-fallback a {
  display: inline-block;
  margin-top: 12px;
  padding: 8px 18px;
  border-radius: var(--radius-full, 9999px);
  border: 1px solid var(--accent);
  color: var(--text-primary);
  text-decoration: none;
  font-size: 13px;
}
.hud-fallback a:hover { background: oklch(24% 0.03 270 / 0.6); }
@media (max-width: 560px) {
  .hud-row .hud-vol { width: 70px; }
  .hud-row .hud-sig { display: none; }
}

      <span class="logo-layer phantom phantom-2"><svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg"><use href="#mark-bn"/></svg></span>
      <span class="logo-layer phantom phantom-3"><svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg"><use href="#mark-bn"/></svg></span>
      <span class="logo-layer core"><svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg"><use href="#mark-bn"/></svg></span>
    </div>
  </div>

  <div class="glyphs">
    <div class="glyph">◆</div>
    <div class="glyph">⟐</div>
    <div class="glyph">⬡</div>
    <div class="glyph">◈</div>
    <div class="glyph">⟡</div>
    <div class="glyph">⬢</div>
    <div class="glyph">◇</div>
    <div class="glyph">⟠</div>
  </div>

  <!-- Center content -->
  <div class="center-content">
    <div class="title-wrapper">
      <div class="pre-title">⟡ ZHIZHILABS ⟡</div>
      <h1 class="main-title" data-text="Zhizhi Labs">Zhizhi Labs</h1>
      <p class="sub-title">BEYOND THE VISIBLE SPECTRUM</p>
      <p class="value-prop">实时发现 Solana meme 新币 —— 按交易量、持仓、聪明钱与 AI 叙事信号交叉排序。</p>
    </div>

    <div class="btn-container">
      <div class="portal"></div>
      <div class="phantom-rings">
        <div class="phantom-ring"></div>
        <div class="phantom-ring"></div>
        <div class="phantom-ring"></div>
        <div class="phantom-ring"></div>
        <div class="phantom-ring"></div>
      </div>
      <a class="explore-btn" id="exploreBtn" href="/ranking">
        <div class="btn-scanline"></div>
        <span class="btn-text">查看实时榜单</span>
        <div class="orbit-particle"></div>
        <div class="orbit-particle"></div>
        <div class="orbit-particle"></div>
      </a>
      <div class="btn-shadow"></div>
    </div>

    <div id="zl-hud" class="zl-glass-panel" style="width:100%;max-width:760px;margin:32px auto;padding:8px 0">
      <div class="hud-row" style="opacity:.55"><span class="hud-rank zl-num">#1</span><span class="hud-name"><span class="zl-skel" style="display:inline-block;width:120px"></span></span><span class="hud-vol zl-num"><span class="zl-skel" style="display:inline-block;width:60px"></span></span><span class="hud-chg zl-num"><span class="zl-skel" style="display:inline-block;width:48px"></span></span><span class="hud-sig"><span class="zl-skel" style="display:inline-block;width:48px"></span></span></div>
      <div class="hud-row" style="opacity:.4"><span class="hud-rank zl-num">#2</span><span class="hud-name"><span class="zl-skel" style="display:inline-block;width:120px"></span></span><span class="hud-vol zl-num"><span class="zl-skel" style="display:inline-block;width:60px"></span></span><span class="hud-chg zl-num"><span class="zl-skel" style="display:inline-block;width:48px"></span></span><span class="hud-sig"><span class="zl-skel" style="display:inline-block;width:48px"></span></span></div>
      <div class="hud-row" style="opacity:.28"><span class="hud-rank zl-num">#3</span><span class="hud-name"><span class="zl-skel" style="display:inline-block;width:120px"></span></span><span class="hud-vol zl-num"><span class="zl-skel" style="display:inline-block;width:60px"></span></span><span class="hud-chg zl-num"><span class="zl-skel" style="display:inline-block;width:48px"></span></span><span class="hud-sig"><span class="zl-skel" style="display:inline-block;width:48px"></span></span></div>

  <div class="scanlines"></div>
  <div class="noise"></div>

  <div class="bottom-hint">
    <span class="arrow">↓</span>
    ENTER THE VOID
  </div>

  <div class="ripple-ring" id="ripple"></div>
</div>

<script>
const btn = document.getElementById('exploreBtn');
const ripple = document.getElementById('ripple');
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// CTA 是原生 <a href="/ranking">,导航交给浏览器;这里只补一个点击辉光彩蛋
if (btn) btn.addEventListener('click', function() {
  if (reduceMotion || !ripple) return;
  const rect = btn.getBoundingClientRect();
  ripple.style.left = (rect.left + rect.width / 2) + 'px';
  ripple.style.top = (rect.top + rect.height / 2) + 'px';
  ripple.classList.remove('active');
  void ripple.offsetWidth;
  ripple.classList.add('active');
});

// Mouse parallax(可滚动后:仅在 hero 仍可见 + 非 reduced-motion 时启用,避免和滚动打架)
if (!reduceMotion) {
  const universe = document.querySelector('.universe');
  let heroVisible = true;
  if (universe && 'IntersectionObserver' in window) {
    new IntersectionObserver((entries) => {
      heroVisible = entries[0].isIntersecting;
    }, { threshold: 0.15 }).observe(universe);
  }
  document.addEventListener('mousemove', function(e) {
    if (!heroVisible) return;
    const cx = window.innerWidth / 2;
    const cy = window.innerHeight / 2;
    const dx = (e.clientX - cx) / cx;
    const dy = (e.clientY - cy) / cy;
    const nebula = document.querySelector('.nebula');
    if (nebula) nebula.style.transform = `translate(${dx * 20}px, ${dy * 20}px)`;
    const orb = document.querySelector('.distortion-orb');
    if (orb) orb.style.transform = `translate(${dx * -15}px, ${dy * -15}px)`;
    const content = document.querySelector('.center-content');
    if (content) content.style.transform = `translate(${dx * 5}px, ${dy * 5}px)`;
    document.querySelectorAll('.brand-logo').forEach((logo, i) => {
      const speed = (i % 3 + 1) * 4;
      const dir = i % 2 === 0 ? 1 : -1;
      logo.style.setProperty('--px', `${dx * speed * dir}px`);
      logo.style.setProperty('--py', `${dy * speed * dir}px`);
    });
  });
}

// === LIVE TOP-3 HUD ===
(function () {
  const hud = document.getElementById('zl-hud');
  if (!hud) return;

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function fmtVol(v) {
    const n = Number(v) || 0;
    if (n >= 1e6) return '$' + (n / 1e6).toFixed(2) + 'M';
    if (n >= 1e3) return '$' + Math.round(n / 1e3) + 'K';
    return '$' + Math.round(n);
  }
  function fmtChg(c) {
    const n = Number(c) || 0;
    return (n >= 0 ? '+' : '') + n.toFixed(1) + '%';
  }
  function fallback() {
    hud.innerHTML = '<div class="hud-fallback">榜单加载中,稍后重试<br><a href="/ranking">查看完整榜单 →</a></div>';
  }

  Promise.allSettled([
    fetch('/api/ranking').then(r => r.ok ? r.json() : Promise.reject()),
    fetch('/api/kb-signals').then(r => r.ok ? r.json() : Promise.reject())
  ]).then(([rankingRes, kbRes]) => {
    // /api/ranking is the required source; /api/kb-signals is an optional signal join.
    const ranking = rankingRes.status === 'fulfilled' ? rankingRes.value : null;
    const kb = kbRes.status === 'fulfilled' ? kbRes.value : null;
    const rows = Array.isArray(ranking) ? ranking : (ranking && ranking.rows) || [];
    // Only fall back if ranking itself failed or is empty; kb-signals failure must NOT block the HUD.
    if (!rows.length) { fallback(); return; }
    const kbRows = Array.isArray(kb) ? kb : (kb && kb.rows) || [];
    const map = new Map(kbRows.map(s => [s.ca, s.conviction_rating || (s.smart_money_24h ? '聪明钱' : '')]));
    const top = rows.slice(0, 3);
    hud.innerHTML = top.map((row, i) => {
      const chg = Number(row.price_change_24h) || 0;
      const sig = map.get(row.token) || '—';
      return '<div class="hud-row">' +
        '<span class="hud-rank zl-num">#' + (i + 1) + '</span>' +
        '<span class="hud-name">' + esc(row.name || row.symbol || '?') +
          '<span class="hud-sym">' + esc(row.symbol || '') + '</span></span>' +
        '<span class="hud-vol zl-num">' + fmtVol(row.tx_volume_u_24h) + '</span>' +
        '<span class="hud-chg zl-num ' + (chg >= 0 ? 'zl-up' : 'zl-dn') + '">' + fmtChg(chg) + '</span>' +
        '<span class="hud-sig">' + esc(sig) + '</span>' +
      '</div>';
    }).join('');
  }).catch(fallback);
})();
</script>

</body>
